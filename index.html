<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#090909"><title>DCC OS</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icon-192.png"><link rel="stylesheet" href="styles.css"></head><body>
<div id="app-shell"><header class="topbar brand-header-full"><img class="full-header-card" src="assets/dcc-hero.jpg" alt="Davis Custom Counter Tops & More"><div class="header-shade"></div><div class="job-pill" id="topStatus">Draft Quote</div></header><main id="screen"></main><nav class="tabbar" aria-label="DCC OS Navigation"><button data-screen="customer">Customer</button><button data-screen="project">Project</button><button data-screen="concept">Concept</button><button data-screen="quote">Quote</button><button data-screen="purchase">Purchase</button><button data-screen="time">Time</button><button data-screen="jobs">Jobs</button><button data-screen="pricing">Pricing</button></nav></div>
<template id="customer"><section class="hero-card customer-brand-hero"><img src="assets/dcc-hero.jpg" alt="Davis Custom Counter Tops & More business card front"></section><section class="page-head"><div><h1>Customer & Job</h1><p>Enter it once. The whole job updates.</p></div></section><section class="form-grid"><label>Customer Name<input id="customerName"></label><label>Phone<input id="phone" inputmode="tel"></label><label>Email<input id="email" inputmode="email"></label><label>Estimate #<input id="estimateNo"></label><<label class="span2">
    Project Name
    <input id="projectName">
</label>

<label class="span2">
    Customer Drawing / Blueprint
    <input
        id="customerDrawing"
        type="file"
        accept=".pdf,.png,.jpg,.jpeg,.webp,.dwg,.dxf"
    >
</label>

<div id="customerDrawingStatus" class="card">
    <strong>No drawing uploaded.</strong>
</div><label class="span2">Address<input id="address"></label><label>Primary Finish<select id="finishSystem"><option>Polykote</option><option>Epoxy + Top Coat</option><option>Epoxy</option></select></label><label>Deposit %<input id="depositPct" type="number" min="0" max="100"></label><label>Labor Discount %<input id="laborDiscountPct" type="number" min="0" max="100"></label><label>Salesperson<input id="salesperson"></label><label>Status<select id="jobStatus"><option>Draft Quote</option><option>Quote Sent</option><option>Approved</option><option>In Production</option><option>Ready for Install</option><option>Completed</option></select></label><label class="span2">Notes<textarea id="notes"></textarea></label></section></template>
<template id="project"><section class="page-head"><div><h1>Project Builder</h1><p>Build the whole job. Add every top and vertical section.</p></div><button class="danger ghost" id="clearJob">Clear Job</button></section><section class="module-tabs"><button data-module="countertop" class="active">Countertop / Bar</button><button data-module="universal">Universal</button><button data-module="deep">Deep Pour / River</button><button data-module="backlit">Backlit / LED</button></section><div id="moduleHost"></div></template>
<template id="concept"><section class="page-head"><div><h1>Visual Concept</h1><p>Before photo + DCC concept for the customer.</p></div></section><section class="photo-grid"><div class="photo-box"><input type="file" accept="image/*" id="beforePhoto"><div id="beforePreview">Tap to add customer before photo</div></div><div class="photo-box"><input type="file" accept="image/*" id="conceptPhoto"><div id="conceptPreview">Tap to add AI concept / sample preview</div></div></section><label class="design-notes">Design Notes<textarea id="designNotes"></textarea></label></template>
<template id="quote"><div class="v22-quote-tools"><button type="button" onclick="dccPrintQuoteV22()">PRINT / SAVE CUSTOMER QUOTE</button></div><section class="page-head"><div><h1>Quote Review</h1><p>Every active estimator module rolls into one customer total.</p></div><button class="secondary compact" id="printQuote">Print / PDF</button></section><section class="quote-sheet"><div class="quote-brand"><img src="assets/icon-192.png" alt="DCC"><div><h2>Davis Custom Counter Tops & More</h2><p>Custom functional art for homes & businesses</p></div></div><div class="quote-customer"><div><span>Customer</span><strong data-bind="customerName">New Customer</strong></div><div><span>Project</span><strong data-bind="projectName">New Project</strong></div><div><span>Estimate</span><strong data-bind="estimateNo">—</strong></div></div><div class="quote-row"><span>Countertop / Bar</span><strong data-money="counterTotal">$0</strong></div><div class="quote-row"><span>Deep Pour / River</span><strong data-money="deepTotal">$0</strong></div><div class="quote-row"><span>Backlit / Lighting</span><strong data-money="backlitTotal">$0</strong></div><div class="quote-row"><span>Shop Supplies</span><strong data-money="supplies">$0</strong></div><div class="quote-row"><span>Shop Overhead</span><strong data-money="overhead">$0</strong></div><div class="quote-row"><span>Travel / Mileage</span><strong data-money="mileageCharge">$0</strong></div><div class="quote-row"><span>Sales Tax</span><strong data-money="tax">$0</strong></div><div class="quote-row total"><span>Project Total</span><strong data-money="total">$0</strong></div><div class="quote-row"><span>Deposit Due</span><strong data-money="deposit">$0</strong></div><div class="quote-row"><span>Balance Due</span><strong data-money="balance">$0</strong></div></section><section class="card"><h2>Live Quote Roll-Up</h2><div id="quoteAutoSummary"></div></section>
</template>
<template id="purchase"><section class="page-head"><div><h1>Purchase Center</h1><p>Whole-job quantities from every active module.</p></div></section><section class="purchase-list" id="purchaseList"></section><section class="card"><h2>Live Purchase List</h2><div id="purchaseAutoList"></div></section>
<section id="dccPurchaseReconcileV24" class="dcc-purchase-reconcile-v24"></section><section id="dccMaterialsV23" class="dcc-materials-v23"></section></template>
<template id="time"><section class="page-head"><div><h1>Time Clock / Labor Log</h1><p>Track actual labor on this job so DCC can compare estimated vs real hours.</p></div><button class="secondary compact" id="addManualTime">+ Manual Time</button></section><section class="time-clock-card"><div><span>Current Job</span><strong data-bind="customerName">New Customer</strong><small data-bind="projectName">New Project</small></div><div><span>Active Timer</span><strong id="activeTimerText">Not running</strong><small id="activeTimerSub">Tap Start Work when you begin.</small></div><div class="time-actions"><button id="startWork">Start Work</button><button class="danger" id="stopWork">Stop</button></div></section><section class="form-grid"><label>Worker<select id="timeWorker"><option>Shawn</option><option>Summer</option><option>Both</option><option>Other</option></select></label><label>Work Type<select id="timeType"><option>Measure / Template</option><option>Sample</option><option>Fabrication</option><option>Epoxy / Pour</option><option>Sanding / Finish</option><option>Electrical / Lighting</option><option>Install / Delivery</option><option>Admin / Quote</option><option>Shop Cleanup</option><option>Other</option></select></label><label>Notes<input id="timeNote" placeholder="What did we work on?"></label></section><section class="summary-grid"><div class="metric"><span>Total Actual Hours</span><strong data-num="actualHours">0</strong></div><div class="metric"><span>Estimated Labor Value</span><strong data-money="estimatedLaborValue">$0</strong></div><div class="metric"><span>Actual Labor Value</span><strong data-money="actualLaborValue">$0</strong></div><div class="metric"><span>Labor Difference</span><strong data-money="laborDifference">$0</strong></div></section><section class="module-card"><h2>Recent Job Time Entries</h2><div id="timeEntries"></div></section><section id="dccTimeSummaryV17"></section><section id="dccJobTimeBreakdownV19" class="dcc-job-time-report">
<div class="v19-head"><div><span>DCC OS • JOB LABOR</span><h3>Customer / Job Time Breakdown</h3></div>
<select id="dccJobTimeReportJob"><option value="">Select customer / job</option></select></div>
<div id="dccJobTimeReportBody"></div></section><section id="timeTracking" class="dcc-time-page"></section><section id="dccOutsideHelpV20" class="dcc-outside-help"></section></template>
<template id="jobs"><section id="dccJobCommandV21" class="dcc-job-command"></section><section id="dccProductionV22" class="dcc-production-v22"></section><section id="dccFreshStartV28"></section><section id="dccBackboneV25" class="dcc-backbone-v25"></section><section id="dccFollowupsV26" class="dcc-followups-v26"></section><section id="dccBusinessReportV26" class="dcc-business-report-v26"></section><section class="page-head"><div><h1>Job Board</h1><p>Save the current job, reopen it, and move it through production.</p></div><div class="head-actions"><button class="secondary compact" id="newJob">+ New Job</button><button class="secondary compact" id="saveJob">Save Current Job</button></div></section><section id="savedJobs" class="saved-jobs"></section><section class="kanban" id="kanban"></section></template>
<template id="pricing"><section class="page-head"><div><h1>Pricing Control</h1><p>Update DCC defaults here. New calculations use these prices immediately.</p></div><button class="secondary compact" id="resetPricing">Reset DCC Defaults</button></section><section class="form-grid"><label>Counter Labor $ / Sq Ft<input id="priceCounterLabor" type="number" step=".01"></label><label>Backlit Labor $ / Sq Ft<input id="priceLedLabor" type="number" step=".01"></label><label>Fiber Labor $ / Sq Ft<input id="priceFiberLabor" type="number" step=".01"></label><label>Deep Pour Labor $ / Sq Ft<input id="priceDeepLabor" type="number" step=".01"></label><label>Actual Labor $ / Hr<input id="priceActualLaborRate" type="number" step=".01"></label><label>Epoxy 2 Gal Kit $<input id="priceEpoxyKit" type="number" step=".01"></label><label>Epoxy Usable Oz / Kit<input id="priceEpoxyUsableOz" type="number" step="1"></label><label>Polykote 2 Gal Kit $<input id="pricePolyKit" type="number" step=".01"></label><label>Polykote Usable Oz / Kit<input id="pricePolyUsableOz" type="number" step="1"></label><label>Color Coat Oz / Sq Ft<input id="priceColorOzSqFt" type="number" step=".1"></label><label>Polykote Oz / Sq Ft<input id="pricePolyOzSqFt" type="number" step=".1"></label><label>Top Coat Kit $<input id="priceTopCoatKit" type="number" step=".01"></label><label>Top Coat Coverage Sq Ft<input id="priceTopCoatCoverage" type="number" step="1"></label><label>Deep Pour 3 Gal Kit $<input id="priceDeepKit" type="number" step=".01"></label><label>Deep Pour Usable Oz<input id="priceDeepOz" type="number" step="1"></label><label>Acrylic Sheet $<input id="priceAcrylic" type="number" step=".01"></label><label>16 Ft LED Strip $<input id="priceLedStrip" type="number" step=".01"></label><label>SP608E Controller $<input id="priceController" type="number" step=".01"></label><label>Power Supply $<input id="pricePsu" type="number" step=".01"></label><label>1/2 Plywood Sheet $<input id="pricePlywood" type="number" step=".01"></label><label>Shop Supplies %<input id="priceSuppliesPct" type="number" step=".1"></label><label>Shop Overhead %<input id="priceOverheadPct" type="number" step=".1"></label><label>Sales Tax %<input id="priceTaxPct" type="number" step=".1"></label><label>Extira Sheet $<input id="priceSubstrate" type="number" step=".01"></label><label>Extira Usable Sq Ft / Sheet<input id="priceSubstrateUsableSqFt" type="number" step="1"></label></section><section id="dccInventoryV24" class="dcc-inventory-v24"></section></template>
<script src="app.js"></script></body></html>
