name = "dcc-os-api"
main = "./worker.js"
compatibility_date = "2026-07-17"
type = "javascript"
workers_dev = true

[build]
upload_format = "modules"

[site]
# Upload the repository's static assets so the Worker can serve them via __STATIC_CONTENT.
# Exclude the Worker script and config files explicitly if needed.
bucket = "."
include = ["index.html", "app.js", "styles.css", "manifest.webmanifest", "sw.js", "assets/**/*", "icon-*.png"]

# If you need R2, D1, or other bindings, configure them here.
# Example:
# [[r2_buckets]]
# binding = "IMAGES"
# bucket_name = "your-r2-bucket"
#
# [[d1_databases]]
# binding = "DB"
# database_name = "your-d1-database"
#
# [vars]
# OPENAI_API_KEY = "your-openai-api-key"
